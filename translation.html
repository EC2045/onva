<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onva → 日本語 翻訳ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="byam.js?v=conversation2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Noto+Sans+JP:wght@300;400;700&family=JetBrains+Mono&display=swap');



        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        textarea {
            font-family: 'JetBrains Mono', monospace;
        }

        textarea:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .token-known {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 8px;
            margin: 3px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .token-known:hover {
            background: #dbeafe;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .token-unknown {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 8px;
            margin: 3px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
        }

        .token-phrase {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 12px;
            margin: 3px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 16px;
        }

        .token-space {
            display: inline-block;
            width: 16px;
        }

        .onva-preview .onva-images img {
            height: 1.6em !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-animate {
            animation: fadeIn 0.3s ease-out;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            display: inline-block;
        }
    </style>
    <link rel="stylesheet" href="typography.css?v=conversation2">
</head>

<body class="min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="image.png" alt="onva National Flag" class="h-8 w-auto rounded-sm shadow-sm">
                <span class="onva font-bold text-slate-900">!anbya</span>
            </div>
            <div class="flex gap-4">
                <a href="index.html"
                    class="text-[11px] font-bold tracking-widest text-slate-500 hover:text-slate-900 uppercase transition">Kingdom</a>
                <a href="anvum.html"
                    class="text-[11px] font-bold tracking-widest text-slate-500 hover:text-slate-900 uppercase transition">!Anbyam</a>
                <a href="study.html"
                    class="text-[11px] font-bold tracking-widest text-slate-500 hover:text-slate-900 uppercase transition">Study</a>
                <a href="translation.html"
                    class="text-blue-600 border-b-2 border-blue-600 pb-1 text-[11px] font-bold tracking-widest uppercase">Translate</a>
                <a href="print.html"
                    class="text-[11px] font-bold tracking-widest text-slate-500 hover:text-slate-900 uppercase transition">Practice</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-28 pb-24 px-6 max-w-5xl mx-auto w-full">
        <div data-language-slot class="no-print mb-6"></div>

        <!-- Hero -->
        <header class="mb-16 text-center">
            <h1 class="text-4xl font-black text-slate-900 mb-4">onva → 日本語</h1>
            <p class="text-slate-400 text-sm font-bold">onva語のテキストを入力すると、単語ごとに解析して日本語の意味を表示します。</p>
        </header>

        <!-- Input Area -->
        <section class="mb-8">
            <div class="glass-card rounded-[2.5rem] p-8 shadow-xl shadow-slate-100/50">
                <div class="flex items-center gap-3 mb-6">
                    <span class="w-2 h-6 bg-blue-500 rounded-full"></span>
                    <h2 class="text-sm font-black uppercase tracking-widest text-slate-500">Input (onva語)</h2>
                </div>
                <textarea id="onva-input" rows="4" placeholder="onva語を入力してください... 例: b-!a sye t-t !anbyawon"
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-4 text-lg text-slate-900 resize-none focus:border-blue-400 transition"></textarea>
                <div class="flex justify-between items-center mt-4">
                    <div class="onva-preview">
                        <div class="onva text-2xl text-slate-400" id="live-preview"></div>
                    </div>
                    <button onclick="translateOnva()"
                        class="px-8 py-3 bg-slate-900 text-white rounded-full text-xs font-black uppercase tracking-widest hover:bg-slate-800 transition shadow-lg hover:shadow-xl">
                        翻訳する
                    </button>
                </div>
            </div>
        </section>

        <!-- Legend -->
        <div class="flex flex-wrap gap-6 mb-8 px-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">
            <div class="flex items-center gap-2"><span class="legend-dot bg-blue-200"></span> 辞書に登録済み</div>
            <div class="flex items-center gap-2"><span class="legend-dot bg-amber-200"></span> 形態素から推測</div>
            <div class="flex items-center gap-2"><span class="legend-dot bg-red-200"></span> 未知の単語</div>
        </div>

        <!-- Results Area -->
        <section id="results-area" class="hidden">

            <!-- Token Breakdown -->
            <div class="glass-card rounded-[2.5rem] p-8 shadow-xl shadow-slate-100/50 mb-8 result-animate">
                <div class="flex items-center gap-3 mb-6">
                    <span class="w-2 h-6 bg-emerald-500 rounded-full"></span>
                    <h2 class="text-sm font-black uppercase tracking-widest text-slate-500">解析結果</h2>
                </div>
                <div id="token-display" class="flex flex-wrap items-end gap-1 mb-8"></div>

                <div class="border-t border-slate-100 pt-6">
                    <div class="flex items-center gap-3 mb-4">
                        <span class="w-2 h-6 bg-orange-400 rounded-full"></span>
                        <h3 class="text-sm font-black uppercase tracking-widest text-slate-500">日本語訳</h3>
                    </div>
                    <p id="translation-output" class="text-xl font-bold text-slate-800 leading-relaxed"></p>
                </div>
            </div>

            <!-- Phrase Hint -->
            <div id="phrase-hint"
                class="hidden glass-card rounded-[2.5rem] p-6 shadow-lg shadow-emerald-100/30 mb-8 result-animate border-emerald-200">
                <div class="flex items-center gap-3 mb-3">
                    <span class="w-2 h-6 bg-emerald-500 rounded-full"></span>
                    <h3 class="text-sm font-black uppercase tracking-widest text-emerald-600">💡 フレーズ参照</h3>
                </div>
                <p class="text-xs text-slate-500 mb-2">この入力に一致する登録フレーズがあります（参考情報）：</p>
                <p id="phrase-hint-text" class="text-sm font-bold text-emerald-700"></p>
            </div>

            <!-- Word-by-word detail table -->
            <div class="glass-card rounded-[2.5rem] p-8 shadow-xl shadow-slate-100/50 result-animate">
                <div class="flex items-center gap-3 mb-6">
                    <span class="w-2 h-6 bg-violet-500 rounded-full"></span>
                    <h2 class="text-sm font-black uppercase tracking-widest text-slate-500">詳細分解</h2>
                </div>
                <div id="detail-table" class="space-y-3"></div>
            </div>
        </section>

        <!-- Example Sentences -->
        <section class="mt-16">
            <div class="flex items-center gap-3 mb-8">
                <span class="w-2 h-6 bg-rose-400 rounded-full"></span>
                <h2 class="text-sm font-black uppercase tracking-widest text-slate-500">サンプル文</h2>
            </div>
            <div class="grid md:grid-cols-2 gap-4" id="examples-grid"></div>
        </section>
    </main>

    <script type="text/plain" id="translation-rules">Anbyam revision 2: SVO. t-t is required for nominal/adjective predicates. Final wo-wo marks a yes/no question; wo-f what, wo-won who, wo-z where, wo-eti when, wo-n!ag why and wo-ritt how replace unknowns without inversion. Initial wo marks a command; h-b wo a polite request. n- negates the following base; ti- nominalizes a verb phrase and shares the main subject. Affix order is n- + verb + passive -ep + aspect (-u progressive / -!abh perfect) + tense (-p past / -e future). rep wants an object or ti-action; h-te can, n-h-te cannot. N yu-h owner is possession. z-e location, te-z destination, ti-z source, yu-e recipient, eti-z time. bya-t ... bya-n encloses a content clause. N bya-f ... wo-f ... bya-n is a relative clause where wo-f refers to N. A t-tr B means A therefore B. !abu A t-tr B means if A then B. Adjectives precede nouns. Unknown forms must not be silently discarded. Provide Japanese output.</script>
    <script src="vocabulary.js?v=conversation2"></script>
    <script src="anbyam.js?v=conversation2"></script>
    <script src="translation.js?v=conversation2"></script>
<script defer src="i18n.js?v=conversation2" data-site="onva-learning" data-languages="ja,en"></script>
</body>

</html>
